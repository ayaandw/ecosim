<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>EcoSim - Urban Climate Simulation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.51.0/build/stlite.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e1117;
      }
      #loading {
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding-top: 20vh;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.1);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border-left-color: #2e7d32;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading">
        <h2>🌱 Booting EcoSim Engine...</h2>
        <div class="spinner"></div>
        <p>Initializing Python & WebAssembly Runtime (First load takes 5-10s)</p>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.51.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["streamlit", "pandas"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py"
            },
            "components.py": {
              url: "./components.py"
            },
            "screens.py": {
              url: "./screens.py"
            },
            "districts.py": {
              url: "./districts.py"
            },
            "research.py": {
              url: "./research.py"
            },
            "groups.py": {
              url: "./groups.py"
            },
            "finish.py": {
              url: "./finish.py"
            },
            "inspector.py": {
              url: "./inspector.py"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
